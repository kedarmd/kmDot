# Everforest Dark Hard
# No built-in herdr theme exists — base "terminal" (follows the kmDot-themed
# host terminal) with all 19 tokens overridden from the canonical palette
# (sainnhe/everforest, dark hard contrast).
[theme]
name = "terminal"

[theme.custom]
accent = "#83C092"         # aqua — kmDot accent role
panel_bg = "#2E383C"       # bg1
sidebar_bg = "#272E33"     # bg_dim — true main background
active_row_bg = "#374145"  # bg2 — dark tonal container, light text
selection_bg = "#414B50"   # bg3
surface0 = "#2E383C"       # bg1
surface1 = "#374145"       # bg2
surface_dim = "#272E33"    # bg_dim
overlay0 = "#414B50"       # bg3
overlay1 = "#7A8478"       # grey1
text = "#D3C6AA"           # fg
subtext0 = "#9DA9A0"       # grey2
mauve = "#D699B6"          # purple
green = "#A7C080"
yellow = "#DBBC7F"
red = "#E67E80"
blue = "#7FBBB3"
teal = "#83C092"           # aqua
peach = "#E69875"          # orange
