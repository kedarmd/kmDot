general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock after 5 min idle (customize: seconds)
listener {
    timeout = 300
    on-timeout = ~/.config/kmdot/quickshell/scripts/attention-mode.sh idle lock
}

# Suspend after 10 min idle (customize: seconds)
listener {
    timeout = 420
    on-timeout = ~/.config/kmdot/quickshell/scripts/attention-mode.sh idle suspend
}

# Panel off after 6 min idle (in both normal and server mode). Lock at 5 min,
# panel off at 6 min, suspend at 7 min — the ONLY difference in server mode is
# that the sleep inhibitor refuses the suspend below, so the machine stays
# awake serving with the screen already off. Turning the panel off (not
# dimming: brightness would need restoring on wake, DPMS auto-restores) drains
# ~nothing. on-resume re-enables DPMS on ANY activity (mouse move, click, key
# press) — hypridle sees activity even while hyprlock is up, so this is the
# reliable wake path; the misc:mouse_move_enables_dpms/key_press_enables_dpms
# flags in appearance.lua are the compositor-side backup (button clicks alone
# don't trip them).
listener {
    timeout = 360
    on-timeout = ~/.config/kmdot/quickshell/scripts/attention-mode.sh idle dpms
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
