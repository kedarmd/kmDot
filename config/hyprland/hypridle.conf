general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock after 5 min idle (customize: seconds)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend after 10 min idle (customize: seconds)
listener {
    timeout = 420
    on-timeout = systemctl suspend
}

# Panel off after 6 min idle (in both normal and server mode). Lock at 5 min,
# panel off at 6 min, suspend at 7 min — the ONLY difference in server mode is
# that the sleep inhibitor refuses the suspend below, so the machine stays
# awake serving with the screen already off. Turning the panel off (not
# dimming: brightness would need restoring on wake, DPMS auto-restores on
# mouse move via misc:mouse_move_enables_dpms) drains ~nothing.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
}
